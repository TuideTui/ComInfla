name: Refine receipt product capture

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refine_receipt_product_capture.py'
      - '.github/workflows/refine-receipt-product-capture.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/refine_receipt_product_capture.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/receipt-importer-v2.tsx src/lib/receipt-parser-smart.ts
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: focus receipt import on product capture"
            git push
          fi
