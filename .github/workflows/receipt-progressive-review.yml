name: Progressive receipt review patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/receipt-progressive-review.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/receipt_progressive_review.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/receipt-importer-v2.tsx src/app/receipt-quality.css src/app/app/comprando/import-actions.ts
          git commit -m "feat: add progressive receipt review flow"
          git push origin HEAD:main
