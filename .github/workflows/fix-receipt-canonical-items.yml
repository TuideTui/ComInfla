name: Canonical receipt item patch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_receipt_canonical_items.py'
      - '.github/workflows/fix-receipt-canonical-items.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_receipt_canonical_items.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/receipt-parser-smart.ts src/components/receipt-importer-v2.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: cap receipt reconstruction to declared items"
            git push
          fi
