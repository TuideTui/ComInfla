name: Authoritative receipt item count fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_declared_item_count_authoritative.py'
      - '.github/workflows/fix-declared-item-count-authoritative.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_declared_item_count_authoritative.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/receipt-importer-v2.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: trust declared NFC-e item total"
            git push
          fi
