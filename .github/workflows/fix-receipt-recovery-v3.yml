name: Receipt recovery v3 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_receipt_recovery_v3.py'
      - '.github/workflows/fix-receipt-recovery-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_receipt_recovery_v3.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/receipt-parser-smart.ts src/components/receipt-importer-v2.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: make receipt recovery honest and consistent"
            git push
          fi
