name: Targeted receipt count fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_receipt_targeted_count.py'
      - '.github/workflows/fix-receipt-targeted-count.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix_receipt_targeted_count.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/receipt-parser-smart.ts src/components/receipt-importer-v2.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: restore receipt extraction and use stable item count"
            git push
          fi
