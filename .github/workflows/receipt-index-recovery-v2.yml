name: Indexed receipt recovery patch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/receipt_index_recovery_v2.py'
      - '.github/workflows/receipt-index-recovery-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/receipt_index_recovery_v2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/receipt-importer-v2.tsx src/app/receipt-quality.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: validate receipt item counts and preserve missing lines"
            git push
          fi
