name: Receipt upload v2 hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/receipt-upload-v2-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch active receipt importer file selection
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/receipt-importer-v2.tsx')
          source = path.read_text(encoding='utf-8')

          old = """  const uploadRef = useRef<HTMLInputElement | null>(null)\n  const cameraRef = useRef<HTMLInputElement | null>(null)\n  const [open, setOpen] = useState(false)"""
          new = """  const uploadRef = useRef<HTMLInputElement | null>(null)\n  const cameraRef = useRef<HTMLInputElement | null>(null)\n  const filesRef = useRef<ImportFile[]>([])\n  const [open, setOpen] = useState(false)"""
          assert old in source
          source = source.replace(old, new, 1)

          marker = """  function resetState() {\n    files.forEach((entry) => { if (entry.previewUrl) URL.revokeObjectURL(entry.previewUrl) })"""
          replacement = """  useEffect(() => {\n    filesRef.current = files\n  }, [files])\n\n  useEffect(() => () => {\n    filesRef.current.forEach((entry) => { if (entry.previewUrl) URL.revokeObjectURL(entry.previewUrl) })\n  }, [])\n\n  function resetState() {\n    filesRef.current.forEach((entry) => { if (entry.previewUrl) URL.revokeObjectURL(entry.previewUrl) })\n    filesRef.current = []"""
          assert marker in source
          source = source.replace(marker, replacement, 1)

          start = source.index('  function addFiles(list: FileList | null) {')
          end = source.index('\n\n  function removeFile', start)
          source = source[:start] + """  function addFiles(selectedFiles: File[] | FileList | null) {\n    const selected = selectedFiles ? Array.from(selectedFiles) : []\n    if (!selected.length) return\n\n    setError('')\n    const current = filesRef.current\n    const seen = new Set(current.map((entry) => `${entry.file.name}:${entry.file.size}:${entry.file.lastModified}`))\n    const additions: ImportFile[] = []\n    let rejectionMessage = ''\n\n    for (const file of selected) {\n      if (current.length + additions.length >= 10) break\n      const identity = `${file.name}:${file.size}:${file.lastModified}`\n      if (seen.has(identity)) continue\n\n      if (file.size > 15 * 1024 * 1024) {\n        rejectionMessage = 'Cada arquivo pode ter no máximo 15 MB.'\n        continue\n      }\n\n      const lowerName = file.name.toLowerCase()\n      const isPdf = file.type === 'application/pdf' || lowerName.endsWith('.pdf')\n      const isImage = file.type.startsWith('image/') || /\\.(jpe?g|png|webp)$/i.test(lowerName)\n      if (!isPdf && !isImage) {\n        rejectionMessage = 'Use imagens JPG, PNG, WebP ou documentos PDF.'\n        continue\n      }\n\n      additions.push({\n        key: `${Date.now()}-${Math.random().toString(36).slice(2)}`,\n        file,\n        previewUrl: isImage ? URL.createObjectURL(file) : null,\n      })\n      seen.add(identity)\n    }\n\n    if (!additions.length) {\n      if (rejectionMessage) setError(rejectionMessage)\n      return\n    }\n\n    const next = [...current, ...additions]\n    filesRef.current = next\n    setFiles(next)\n    setStage('files')\n    if (rejectionMessage) setError(rejectionMessage)\n  }\n\n  function handleFileSelection(event: React.ChangeEvent<HTMLInputElement>) {\n    const selected = event.currentTarget.files ? Array.from(event.currentTarget.files) : []\n    event.currentTarget.value = ''\n    addFiles(selected)\n  }""" + source[end:]

          old = """  function removeFile(key: string) {\n    setFiles((current) => {\n      const target = current.find((entry) => entry.key === key)\n      if (target?.previewUrl) URL.revokeObjectURL(target.previewUrl)\n      const next = current.filter((entry) => entry.key !== key)\n      if (!next.length) setStage('source')\n      return next\n    })\n  }"""
          new = """  function removeFile(key: string) {\n    const current = filesRef.current\n    const target = current.find((entry) => entry.key === key)\n    if (target?.previewUrl) URL.revokeObjectURL(target.previewUrl)\n    const next = current.filter((entry) => entry.key !== key)\n    filesRef.current = next\n    setFiles(next)\n    if (!next.length) setStage('source')\n  }"""
          assert old in source
          source = source.replace(old, new, 1)

          old = """  async function processFiles(aggressive = false) {\n    if (!files.length) return\n    setStage('processing'); setError(''); setProgress(0); setShowRawText(false)"""
          new = """  async function processFiles(aggressive = false) {\n    const filesToProcess = filesRef.current\n    if (!filesToProcess.length) {\n      setError('Adicione pelo menos uma foto ou PDF antes de iniciar a leitura.')\n      setStage('source')\n      return\n    }\n    setStage('processing'); setError(''); setProgress(0); setShowRawText(false)"""
          assert old in source
          source = source.replace(old, new, 1)
          source = source.replace('for (let index = 0; index < files.length; index++) {\n        const entry = files[index]\n        setProgress(Math.round(index / files.length * 88))\n        setProgressText(`${aggressive ? \'Relendo\' : \'Lendo\'} ${index + 1} de ${files.length}: ${entry.file.name}`)', 'for (let index = 0; index < filesToProcess.length; index++) {\n        const entry = filesToProcess[index]\n        setProgress(Math.round(index / filesToProcess.length * 88))\n        setProgressText(`${aggressive ? \'Relendo\' : \'Lendo\'} ${index + 1} de ${filesToProcess.length}: ${entry.file.name}`)', 1)

          old = """<button className=\"button button-primary\" type=\"button\" onClick={() => processFiles(false)}>Ler comprovantes →</button>"""
          new = """<button className=\"button button-primary\" type=\"button\" onClick={() => processFiles(false)} disabled={!files.length}>Ler comprovantes →</button>"""
          assert old in source
          source = source.replace(old, new, 1)

          old = """        <input ref={uploadRef} className=\"receipt-hidden-input\" type=\"file\" accept=\"image/jpeg,image/png,image/webp,application/pdf,.pdf\" multiple onChange={(e)=>{addFiles(e.target.files);e.currentTarget.value=''}}/>\n        <input ref={cameraRef} className=\"receipt-hidden-input\" type=\"file\" accept=\"image/*\" capture=\"environment\" onChange={(e)=>{addFiles(e.target.files);e.currentTarget.value=''}}/>"""
          new = """        <input ref={uploadRef} className=\"receipt-hidden-input\" type=\"file\" accept=\"image/jpeg,image/png,image/webp,application/pdf,.jpg,.jpeg,.png,.webp,.pdf\" multiple onChange={handleFileSelection}/>\n        <input ref={cameraRef} className=\"receipt-hidden-input\" type=\"file\" accept=\"image/*\" capture=\"environment\" onChange={handleFileSelection}/>"""
          assert old in source
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/receipt-importer-v2.tsx
          git commit -m "fix: persist selected files in active receipt importer"
          git push origin HEAD:main
