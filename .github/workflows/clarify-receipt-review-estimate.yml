name: Clarify receipt review estimate

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/clarify_receipt_review_estimate.py'
      - '.github/workflows/clarify-receipt-review-estimate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/clarify_receipt_review_estimate.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/receipt-importer-v2.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: clarify receipt review estimate"
            git push
          fi
